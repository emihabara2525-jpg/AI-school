<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>スタンプ工房 — キャラ決めウィザード</title>
<style>
  :root{
    --bg:#fff7fb; --card:#ffffff; --ink:#3b2b34; --sub:#8a7680;
    --pink:#ff7fb0; --pink-d:#ff5c9c; --mint:#7fd8c7; --sun:#ffd36e;
    --line:#f0dbe6; --shadow:0 6px 20px rgba(255,124,176,.18);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{margin:0; font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.6}
  .wrap{max-width:520px; margin:0 auto; padding:16px 16px 120px}
  header.top{text-align:center; padding:18px 0 6px}
  header.top h1{margin:0; font-size:22px; letter-spacing:.02em}
  header.top p{margin:4px 0 0; color:var(--sub); font-size:13px}

  /* progress */
  .bar{display:flex; gap:6px; margin:14px 0 6px}
  .bar span{flex:1; height:6px; border-radius:99px; background:var(--line)}
  .bar span.on{background:var(--pink)}
  .stepno{text-align:center; color:var(--sub); font-size:12px; margin-bottom:10px}

  .card{background:var(--card); border-radius:20px; box-shadow:var(--shadow);
    padding:20px 18px; border:1px solid var(--line)}
  .q{font-size:18px; font-weight:700; margin:0 0 4px}
  .hint{color:var(--sub); font-size:13px; margin:0 0 16px}

  .opts{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .opt{border:2px solid var(--line); background:#fff; border-radius:16px;
    padding:14px 10px; text-align:center; cursor:pointer; font-size:15px; transition:.15s}
  .opt .emo{display:block; font-size:30px; margin-bottom:4px}
  .opt .sub{display:block; color:var(--sub); font-size:11px; margin-top:2px}
  .opt:active{transform:scale(.97)}
  .opt.sel{border-color:var(--pink); background:#fff0f6; box-shadow:0 0 0 3px #ffd9e8 inset}

  .chips{display:flex; flex-wrap:wrap; gap:8px}
  .chip{border:2px solid var(--line); background:#fff; border-radius:99px;
    padding:8px 14px; font-size:14px; cursor:pointer; transition:.15s}
  .chip.sel{border-color:var(--mint); background:#effbf8; color:#1c7f6c; font-weight:700}
  .chip:active{transform:scale(.96)}

  input.txt{width:100%; font-size:17px; padding:14px; border:2px solid var(--line);
    border-radius:14px; outline:none; background:#fff}
  input.txt:focus{border-color:var(--pink)}

  .nav{position:fixed; left:0; right:0; bottom:0; background:rgba(255,247,251,.92);
    backdrop-filter:blur(6px); border-top:1px solid var(--line); padding:12px 16px;
    display:flex; gap:10px; max-width:520px; margin:0 auto}
  .btn{flex:1; border:none; border-radius:14px; padding:15px; font-size:16px;
    font-weight:700; cursor:pointer}
  .btn.ghost{background:#fff; border:2px solid var(--line); color:var(--sub); flex:0 0 96px}
  .btn.go{background:var(--pink); color:#fff; box-shadow:var(--shadow)}
  .btn.go:disabled{background:#f3c9dc; box-shadow:none}
  .btn:active{transform:translateY(1px)}

  /* result */
  .sheet{background:linear-gradient(160deg,#fff,#fff5fa); border:2px dashed var(--pink);
    border-radius:20px; padding:18px; margin-top:4px}
  .sheet h2{margin:0 0 12px; font-size:18px; display:flex; align-items:center; gap:8px}
  .row{display:flex; padding:9px 0; border-bottom:1px dashed var(--line); font-size:15px}
  .row:last-child{border:none}
  .row .k{flex:0 0 92px; color:var(--sub); font-size:13px}
  .row .v{flex:1; font-weight:600}
  .tools{display:grid; gap:10px; margin-top:16px}
  .tools button{border:none; border-radius:14px; padding:14px; font-size:15px; font-weight:700; cursor:pointer}
  .b-copy{background:var(--mint); color:#0f5f51}
  .b-again{background:#fff; border:2px solid var(--line)!important; color:var(--sub)}
  .b-save{background:var(--sun); color:#7a5a10}
  .note{color:var(--sub); font-size:12px; text-align:center; margin-top:10px}
  .hidden{display:none}

  /* lines (作るライン) */
  .lines{display:flex; align-items:center; gap:6px; margin-top:14px; flex-wrap:wrap}
  .lines-lbl{font-size:12px; color:var(--sub); margin-right:2px}
  .line{border:2px solid var(--line); background:#fff; border-radius:99px;
    padding:7px 12px; font-size:13px; font-weight:700; color:var(--sub); cursor:pointer}
  .line.on{background:var(--sun); color:#7a5a10; border-color:var(--sun)}
  .line:active{transform:translateY(1px)}

  /* tabs */
  .tabs{display:flex; gap:8px; margin:8px 0 4px}
  .tab{flex:1; border:2px solid var(--line); background:#fff; border-radius:99px;
    padding:10px; font-size:14px; font-weight:700; color:var(--sub); cursor:pointer}
  .tab.on{background:var(--pink); color:#fff; border-color:var(--pink)}
  .tab:active{transform:translateY(1px)}

  /* serifu */
  .charbar{background:#fff; border:1px solid var(--line); border-radius:14px;
    padding:10px 14px; font-size:13px; color:var(--sub); margin-bottom:12px}
  .charbar b{color:var(--ink)}
  .goal{display:flex; align-items:center; gap:8px; margin-bottom:12px; flex-wrap:wrap}
  .goal .lbl{font-size:13px; color:var(--sub)}
  .goal select{font-size:14px; padding:6px 10px; border:2px solid var(--line); border-radius:10px; background:#fff}
  .goal .cnt{margin-left:auto; font-weight:800; font-size:16px}
  .goal .cnt.full{color:#1c7f6c}
  .catbar{display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; margin-bottom:8px}
  .catbar button{white-space:nowrap; border:2px solid var(--line); background:#fff;
    border-radius:99px; padding:7px 12px; font-size:13px; cursor:pointer; color:var(--sub)}
  .catbar button.on{background:#fff0f6; border-color:var(--pink); color:var(--pink-d); font-weight:700}
  .sugg{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px}
  .sugg .chip.picked{border-color:var(--pink); background:#fff0f6; color:var(--pink-d); font-weight:700}
  .sugg .chip.picked::before{content:"✓ "}
  .picklist{background:#fff; border:1px solid var(--line); border-radius:14px; padding:6px 4px}
  .picklist .empty{color:var(--sub); font-size:13px; text-align:center; padding:18px}
  .prow{display:flex; align-items:center; gap:8px; padding:8px 10px; border-bottom:1px dashed var(--line)}
  .prow:last-child{border:none}
  .prow .num{flex:0 0 22px; color:var(--sub); font-size:12px}
  .prow input{flex:1; border:none; font-size:15px; background:transparent; outline:none; color:var(--ink)}
  .prow .del{border:none; background:#ffe3ee; color:var(--pink-d); border-radius:8px; width:28px; height:28px; cursor:pointer; font-size:15px}
  .addrow{display:flex; gap:8px; margin:10px 0 4px}
  .addrow input{flex:1; border:2px solid var(--line); border-radius:10px; padding:10px; font-size:15px; outline:none}
  .addrow button{border:none; background:var(--mint); color:#0f5f51; border-radius:10px; padding:0 16px; font-weight:700; cursor:pointer}

  /* prompt (量産) */
  .langtoggle{display:flex; gap:6px; margin-bottom:12px}
  .langtoggle button{border:2px solid var(--line); background:#fff; border-radius:99px;
    padding:6px 16px; font-size:13px; font-weight:700; color:var(--sub); cursor:pointer}
  .langtoggle button.on{background:var(--pink); color:#fff; border-color:var(--pink)}
  .pcard{background:#fff; border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:10px}
  .pcard .pnum{font-size:12px; color:var(--pink-d); font-weight:800; margin-bottom:5px}
  .pcard .ptxt{font-size:13.5px; line-height:1.55; white-space:pre-wrap; color:var(--ink)}
  .pcard .pcopy{margin-top:9px; border:none; background:var(--mint); color:#0f5f51;
    border-radius:9px; padding:8px 14px; font-size:13px; font-weight:700; cursor:pointer}
  .pcard .pcopy:active{transform:translateY(1px)}
  .guide{background:#fff; border:2px dashed var(--pink); border-radius:16px; padding:24px 18px;
    text-align:center; color:var(--sub); font-size:14px; line-height:1.7}
  .toast{position:fixed; left:50%; bottom:96px; transform:translateX(-50%);
    background:#3b2b34; color:#fff; padding:10px 18px; border-radius:99px; font-size:14px;
    opacity:0; transition:.3s; pointer-events:none}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>🎨 スタンプ工房</h1>
    <p>質問に答えるだけで、あなたのキャラが決まる</p>
  </header>

  <div class="lines" id="lines">
    <span class="lines-lbl">作るライン</span>
    <button class="line on" data-line="otona">👩‍💻 大人向け</button>
    <button class="line" data-line="kodomo">🎮 こども向け</button>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab on" data-view="char">① キャラ</button>
    <button class="tab" data-view="serifu">② セリフ</button>
    <button class="tab" data-view="prompt">③ 量産</button>
    <button class="tab" data-view="sell">④ 売る</button>
  </div>

  <div id="quiz">
    <div class="bar" id="bar"></div>
    <div class="stepno" id="stepno"></div>
    <div class="card" id="card"></div>
  </div>

  <div id="result" class="hidden"></div>

  <div id="serifu" class="hidden"></div>

  <div id="prompt" class="hidden"></div>

  <div id="sell" class="hidden"></div>
</div>

<div class="nav" id="nav">
  <button class="btn ghost" id="back">もどる</button>
  <button class="btn go" id="next">つぎへ</button>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== タイプ別モチーフ =====
const MOTIFS = {
  "動物":[
    {v:"ねこ",emo:"🐱"},{v:"いぬ",emo:"🐶"},{v:"くま",emo:"🐻"},{v:"うさぎ",emo:"🐰"},
    {v:"ひよこ",emo:"🐤"},{v:"ぱんだ",emo:"🐼"},{v:"ハムスター",emo:"🐹"},
  ],
  "人・キャラ":[
    {v:"女の子",emo:"👧"},{v:"男の子",emo:"👦"},{v:"赤ちゃん",emo:"👶"},{v:"社会人・OL",emo:"💼"},
    {v:"おじさん",emo:"🧔"},{v:"おばあちゃん",emo:"👵"},{v:"カップル",emo:"💑"},{v:"ゆるいおばけ",emo:"👻"},
  ],
  "物・食べ物":[
    {v:"おにぎり",emo:"🍙"},{v:"たまご",emo:"🥚"},{v:"パン",emo:"🍞"},{v:"スイーツ",emo:"🍰"},
    {v:"コーヒー",emo:"☕"},{v:"野菜",emo:"🥦"},{v:"ぬいぐるみ",emo:"🧸"},{v:"家電",emo:"🔌"},
  ],
  "文字中心":[
    {v:"デカ文字",emo:"🔠"},{v:"吹き出し",emo:"💬"},{v:"手書きメモ",emo:"📝"},{v:"ハンコ風",emo:"🔖"},
    {v:"ネオン文字",emo:"🌈"},{v:"シンプル文字",emo:"⬜"},
  ],
  _default:[
    {v:"ねこ",emo:"🐱"},{v:"いぬ",emo:"🐶"},{v:"食べ物",emo:"🍙"},{v:"文字",emo:"🔤"},
  ],
};

// ===== 質問データ =====
const steps = [
  {
    key:"type", q:"まず大きく決めよう。何のキャラ？", hint:"売れ筋は「動物」と「文字中心（実用）」。迷ったら動物でOK。",
    type:"single", freeInput:true,
    options:[
      {v:"動物", emo:"🐻", sub:"★いちばん人気"},
      {v:"人・キャラ", emo:"🧑", sub:"名前・属性で刺さる"},
      {v:"物・食べ物", emo:"🍩", sub:"ゆるくて人気"},
      {v:"文字中心", emo:"🔤", sub:"★実用で売れやすい"},
    ]
  },
  {
    key:"motif", q:"くわしく選ぼう", hint:"あとで変えてもOK。ピンとくるものを1つ。",
    type:"single", freeInput:true,
    optionsFn:(a)=> MOTIFS[a.type] || MOTIFS._default
  },
  {
    key:"color", q:"メインの色は？", hint:"1〜2色にしぼると統一感が出て、シリーズ化しやすい。",
    type:"single", freeInput:true,
    options:[
      {v:"白・クリーム", emo:"🤍"},{v:"ピンク", emo:"🩷"},{v:"茶・ベージュ", emo:"🤎"},
      {v:"みずいろ", emo:"🩵"},{v:"きいろ", emo:"💛"},{v:"みどり", emo:"💚"},
    ]
  },
  {
    key:"accent", q:"目印になる特徴は？", hint:"ひと目でその子だと分かる“推しポイント”。各カテゴリから好きなだけ選べます（無しでもOK）。",
    type:"catselect",
    groups:{
      "顔まわり":["ほっぺが赤い","めがね","たれ目","つり目","八重歯","ほっぺにハート","目のクマ","うるうる涙目","ほくろ・そばかす","まる鼻"],
      "頭・髪":["おだんごヘア","前髪パッツン","アホ毛・寝ぐせ","頭に花","王冠","天使の輪・羽","ツノ"],
      "身につけるもの":["リボン","帽子","マフラー","ヘッドホン","ネクタイ","エプロン","リュック・カバン","首輪＋鈴"],
      "体・模様":["ぶち模様","むちむち体型","手足が短い","耳が大きい","しっぽが特徴的"],
    }
  },
  {
    key:"taste", q:"絵の雰囲気（テイスト）は？", hint:"売れ筋は「ゆるふわ」と「シンプル」。凝った絵より“ゆるさ”が有利。",
    type:"single", freeInput:true,
    options:[
      {v:"ゆるふわ", emo:"🫧", sub:"★最も売れ筋"},
      {v:"シンプル・ミニマル", emo:"⚪", sub:"★実用で人気"},
      {v:"かわいい系", emo:"🌸", sub:"女子・推し向け"},
      {v:"手書き風", emo:"✏️", sub:"あたたかい印象"},
      {v:"ネタ・おもしろ", emo:"😆", sub:"バズると強い"},
      {v:"おしゃれ・大人", emo:"🖤", sub:"20〜30代向け"},
    ]
  },
  {
    key:"traits", q:"性格は？（2〜3個えらぶ）", hint:"性格が決まると、セリフや表情がブレなくなる。",
    type:"multi", max:3,
    options:["のんびり","元気","なまいき","甘えんぼ","マイペース","ぶっきらぼう","やさしい","おっちょこちょい","クール","食いしんぼう"]
  },
  {
    key:"tone", q:"口調・しゃべり方は？", hint:"セリフの雰囲気が決まります。",
    type:"single", freeInput:true,
    options:[
      {v:"ためぐち・ゆるい", emo:"😌"},{v:"ていねい・やわらか", emo:"🍵"},
      {v:"関西弁", emo:"🗣️"},{v:"語尾がクセ強", emo:"🌀"},
    ]
  },
  {
    key:"name", q:"最後に名前！自動でつけたよ", hint:"気に入らなければ🎲で別の名前に。自分で書き直してもOK。",
    type:"text", autoName:true, placeholder:"例：もちねこ、ぷくたろう"
  },
];

const answers = {};
const freeMode = {};   // そのステップで「じぶんで書く」を選んでいるか
const catState = {};   // カテゴリ選択ステップで開いているカテゴリ
let cur = 0;

// 保存が使えない環境（プレビュー等）でも壊れないよう安全化
function lsGet(key, fallback){
  try{ const v=localStorage.getItem(key); return v==null?fallback:JSON.parse(v); }
  catch(e){ return fallback; }
}
function lsSet(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); return true; }
  catch(e){ return false; }
}

// 作るライン（大人向け=otona / こども向け=kodomo）。ラインごとに別保存
let line = lsGet('stamp_line', 'otona');
function charsKey(){ return 'stamp_chars_'+line; }
function serifuKey(){ return 'stamp_serifu_'+line; }
function defaultCat(){ return line==='kodomo' ? '10代・ゲーム女子' : '在宅ワーク'; }

const bar = document.getElementById('bar');
const stepno = document.getElementById('stepno');
const card = document.getElementById('card');
const nav = document.getElementById('nav');
const backBtn = document.getElementById('back');
const nextBtn = document.getElementById('next');

function buildBar(){
  bar.innerHTML='';
  steps.forEach((_,i)=>{
    const s=document.createElement('span');
    if(i<=cur) s.className='on';
    bar.appendChild(s);
  });
  stepno.textContent = `ステップ ${cur+1} / ${steps.length}`;
}

// キャラの特徴から名前を自動生成
function suggestName(a){
  const pre = ["もち","ぷく","ふわ","ころ","ぷに","まる","こな","ぽて","むぎ","ちび","なな","きなこ","もぐ","ぽむ","うに","こむ"];
  const suf = ["たろう","ちゃん","ぷー","もん","っち","りん","ぽん","すけ","まる","ぺい"];
  const stick = ["ねこ","いぬ","くま","うさぎ","ひよこ","ぱんだ","ハムスター","たまご","パン","おにぎり"];
  const p = pre[Math.floor(Math.random()*pre.length)];
  const m = a.motif||"";
  // 短くてくっつけやすいモチーフはそのまま合体（例：もち＋ねこ）
  if(stick.includes(m)) return p + m;
  return p + suf[Math.floor(Math.random()*suf.length)];
}

function render(){
  const st = steps[cur];
  buildBar();
  let html = `<p class="q">${st.q}</p><p class="hint">${st.hint}</p>`;
  if(st.type==='single'){
    // タイプに応じて選択肢が変わるステップ（モチーフ）に対応
    const opts = st.optionsFn ? st.optionsFn(answers) : st.options;
    // 選択肢のどれにも一致しない答え＝自由入力とみなす
    const optVals = opts.map(o=>o.v);
    const isCustom = answers[st.key] && !optVals.includes(answers[st.key]);
    const free = st.freeInput && (freeMode[st.key] || isCustom);
    html += `<div class="opts">`;
    opts.forEach(o=>{
      const sel = (!free && answers[st.key]===o.v) ? 'sel':'';
      html += `<div class="opt ${sel}" data-v="${o.v}">
        <span class="emo">${o.emo||''}</span>${o.v}
        ${o.sub?`<span class="sub">${o.sub}</span>`:''}</div>`;
    });
    if(st.freeInput){
      html += `<div class="opt ${free?'sel':''}" data-free="1">
        <span class="emo">✏️</span>じぶんで書く</div>`;
    }
    html += `</div>`;
    if(free){
      const val = isCustom ? answers[st.key] : '';
      html += `<input class="txt" id="freetxt" style="margin-top:12px" placeholder="ここに入力（例：${opts[0].v}）" value="${val}">`;
    }
  } else if(st.type==='multi'){
    html += `<div class="chips">`;
    const arr = answers[st.key]||[];
    st.options.forEach(o=>{
      const sel = arr.includes(o)?'sel':'';
      html += `<div class="chip ${sel}" data-v="${o}">${o}</div>`;
    });
    html += `</div>`;
  } else if(st.type==='catselect'){
    const cats=Object.keys(st.groups);
    let picked = Array.isArray(answers[st.key]) ? answers[st.key].slice()
      : (answers[st.key] && answers[st.key]!=='特になし' ? [answers[st.key]] : []);
    // カテゴリごとのプルダウン（すでに選んだものは一覧から除く）
    cats.forEach(cat=>{
      html += `<select class="txt catadd" data-cat="${cat}" style="margin-bottom:8px">
        <option value="">＋ ${cat}から追加</option>
        ${st.groups[cat].filter(it=>!picked.includes(it)).map(it=>`<option value="${it}">${it}</option>`).join('')}
      </select>`;
    });
    html += `<div class="addrow"><input id="accFree" placeholder="自分で特徴を書く"><button id="accFreeBtn">追加</button></div>`;
    html += `<p class="hint" style="margin:12px 0 6px">選んだ特徴（${picked.length}）　※無しでもOK</p>`;
    if(picked.length===0){
      html += `<div class="picklist"><div class="empty">上のプルダウンから、好きなだけ選ぼう</div></div>`;
    } else {
      html += `<div class="chips">${picked.map((p,i)=>`<div class="chip sel" data-rm="${i}">${p} ✕</div>`).join('')}</div>`;
    }
  } else if(st.type==='text'){
    if(st.autoName && !answers[st.key]) answers[st.key]=suggestName(answers);
    const val=(answers[st.key]||'').replace(/"/g,'&quot;');
    html += `<input class="txt" id="txt" placeholder="${st.placeholder||''}" value="${val}">`;
    if(st.autoName){
      html += `<button id="reroll" style="margin-top:12px;border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px 18px;font-size:15px;font-weight:700;color:var(--pink-d);cursor:pointer">🎲 別の名前にする</button>`;
    }
  }
  card.innerHTML = html;

  // events
  card.querySelectorAll('.opt').forEach(el=>{
    el.onclick=()=>{
      const before = answers[st.key];
      if(el.dataset.free){         // 「じぶんで書く」を選んだ
        freeMode[st.key]=true; answers[st.key]='';
      } else {                     // 通常の選択肢
        freeMode[st.key]=false; answers[st.key]=el.dataset.v;
      }
      // タイプを変えたらモチーフをリセット
      if(st.key==='type' && before!==answers[st.key]){
        delete answers.motif; freeMode.motif=false;
      }
      render(); syncNext();
    };
  });
  const ft = document.getElementById('freetxt');
  if(ft){
    ft.oninput=()=>{ answers[st.key]=ft.value.trim(); syncNext(); };
    ft.focus();
  }
  card.querySelectorAll('.chip').forEach(el=>{
    el.onclick=()=>{
      let arr = answers[st.key]||[];
      const v = el.dataset.v;
      if(arr.includes(v)) arr = arr.filter(x=>x!==v);
      else { if(arr.length>=st.max){ toast(`${st.max}個までだよ`); return;} arr.push(v); }
      answers[st.key]=arr; render(); syncNext();
    };
  });
  const t = document.getElementById('txt');
  if(t){ t.oninput=()=>{ answers[st.key]=t.value.trim(); syncNext(); }; }
  const reroll = document.getElementById('reroll');
  if(reroll){ reroll.onclick=()=>{ answers[st.key]=suggestName(answers); render(); syncNext(); }; }
  // 特徴の複数選択（catselect）
  const accArr=()=> Array.isArray(answers[st.key]) ? answers[st.key]
      : (answers[st.key] && answers[st.key]!=='特になし' ? [answers[st.key]] : []);
  card.querySelectorAll('.catadd').forEach(sel=>{
    sel.onchange=()=>{
      if(!sel.value) return;
      const arr=accArr();
      if(!arr.includes(sel.value)) arr.push(sel.value);
      answers[st.key]=arr; render(); syncNext();
    };
  });
  const accFree=document.getElementById('accFree');
  const accFreeBtn=document.getElementById('accFreeBtn');
  if(accFreeBtn){
    const add=()=>{ const v=accFree.value.trim(); if(!v) return; const arr=accArr(); if(!arr.includes(v)) arr.push(v); answers[st.key]=arr; render(); syncNext(); };
    accFreeBtn.onclick=add;
    accFree.onkeydown=e=>{ if(e.key==='Enter') add(); };
  }
  card.querySelectorAll('.chip[data-rm]').forEach(el=>{
    el.onclick=()=>{ const arr=accArr(); arr.splice(+el.dataset.rm,1); answers[st.key]=arr; render(); syncNext(); };
  });

  backBtn.style.visibility = cur===0 ? 'hidden':'visible';
  nextBtn.textContent = cur===steps.length-1 ? '完成！':'つぎへ';
  syncNext();
}

function syncNext(){
  const st=steps[cur];
  let ok=false;
  if(st.type==='single') ok=!!answers[st.key];
  else if(st.type==='catselect') ok=true;   // 特徴は任意（無しでもOK）
  else if(st.type==='multi') ok=(answers[st.key]||[]).length>=1;
  else if(st.type==='text') ok=!!(answers[st.key]&&answers[st.key].length>=1);
  nextBtn.disabled=!ok;
}

nextBtn.onclick=()=>{
  if(cur<steps.length-1){ cur++; render(); }
  else showResult();
};
backBtn.onclick=()=>{ if(cur>0){ cur--; render(); } };

function enMap(dict, v){ return EN[dict][v] || v; }

// 特徴（複数可）をまとめる
function accentList(a){
  return Array.isArray(a.accent) ? a.accent
    : (a.accent && a.accent!=='特になし' ? [a.accent] : []);
}
function accentJP(a){ const l=accentList(a); return l.length ? l.join('・') : '特になし'; }
function accentEN(a){ return accentList(a).map(x=>enMap('accent',x)).filter(Boolean).join(' and '); }

// セリフから表情を自動推測
function expr(w){
  const has = arr => arr.some(k=>w.includes(k));
  if(has(["ありがと","感謝","助か"]))        return {jp:"にっこり感謝した", en:"smiling and grateful"};
  if(has(["ごめん","すみ","申し訳","悪い"]))   return {jp:"申し訳なさそうな", en:"apologetic and sorry"};
  if(has(["了解","OK","ok","承知","確認","進め","任せ"])) return {jp:"元気にOKサインを出す", en:"confident, giving an OK sign"};
  if(has(["すごい","いいね","ナイス","神","最高"])) return {jp:"目をキラキラさせた", en:"excited with sparkling eyes"};
  if(has(["がんば","ドンマイ","無理しない","応援","ファイト"])) return {jp:"応援している", en:"cheering warmly"};
  if(has(["めんど","疲れ","無理","帰りたい","ねむ","二度寝","現実逃避"])) return {jp:"ぐったり疲れた", en:"tired and exhausted"};
  if(has(["おこ","怒","ムカ","プンプン"]))     return {jp:"ぷんぷん怒った", en:"angry and pouting"};
  if(has(["わかる","それな","たしかに","うん"])) return {jp:"うんうんと共感する", en:"nodding in agreement"};
  if(has(["おなか","食べ","ごはん","はら"]))    return {jp:"食いしんぼうな", en:"hungry, drooling a little"};
  if(has(["おはよ","おやすみ","いってき","ただいま","こんにち","またね"])) return {jp:"やさしく微笑む", en:"gently smiling"};
  if(has(["すき","好き","推し","尊い","エモ","かわい"])) return {jp:"うっとりした", en:"blushing and adoring"};
  return {jp:"表情ゆたかな", en:"with an expressive face"};
}

// キャラの「見た目デザイン」を作るプロンプト（量産の前に見た目を決める用）
function buildCharPrompt(a, lang){
  const traits=(a.traits||[]);
  if(lang==='en'){
    const acc=accentEN(a);
    const accPart= acc ? `, with ${acc}` : '';
    const pers=traits.map(t=>enMap('traits',t)).join(' and ') || 'friendly';
    return `Character design of ${a.name||'a character'}, a ${enMap('taste',a.taste)} ${enMap('motif',a.motif)} character, mainly ${enMap('color',a.color)}${accPart}, ${pers} vibe. Cute LINE-sticker style, single character, front view, transparent background, thick clean outline, simple and memorable. Show 4 DIFFERENT design proposals side by side, each with a different look (vary the face roundness, eye size, and line style), so I can pick the best base design.`;
  }
  const accJP=accentJP(a);
  const accPart=(accJP && accJP!=='特になし') ? `／特徴：${accJP}` : '';
  const pers=traits.join('・') || 'やさしい';
  return `${a.name||'キャラ'}のキャラクターデザイン。${a.motif}のキャラクター／${a.taste}なタッチ／${a.color}が基調${accPart}／${pers}な雰囲気。かわいいLINEスタンプ風、1体だけ、正面向き、背景は透明、太めのはっきりした輪郭線、シンプルで覚えやすいデザイン。見た目の方向性が異なる“4つのデザイン案”を並べて見せて（顔の丸み・目の大きさ・線のタッチなどを変えて）、その中からいちばん良い1体を選べるようにして。`;
}

function buildPrompt(c, w, lang){
  const e = expr(w);
  const traits = (c.traits||[]);
  if(lang==='en'){
    const acc = accentEN(c);
    const accPart = acc ? `, with ${acc}` : '';
    const pers = traits.map(t=>enMap('traits',t)).join(' and ') || 'friendly';
    return `A LINE-sticker illustration of ${c.name||'a character'}, a ${enMap('taste',c.taste)} ${enMap('motif',c.motif)} character, mainly ${enMap('color',c.color)}${accPart}, ${pers} personality, ${e.en}, with the Japanese text "${w}". Single character only, transparent background, thick clean outline, minimal margin, centered near-square composition, flat cute style.`;
  }
  const accJP = accentJP(c);
  const accPart = (accJP && accJP!=='特になし') ? `／特徴：${accJP}` : '';
  const pers = traits.join('・') || 'やさしい';
  return `${c.name||'キャラ'}（${c.motif}のキャラ／${c.taste}なタッチ／${c.color}が基調${accPart}／性格：${pers}）が「${w}」と言っている、${e.jp}表情。LINEスタンプ用、キャラは1体だけ、背景は透明、太めの輪郭線、余白は少なめ、正方形に近い構図。`;
}

function renderPrompt(){
  const s=document.getElementById('prompt');
  const chars=lsGet(charsKey(), []);
  const c=chars[chars.length-1];
  const serifu=lsGet(serifuKey(), []);
  const lineName = line==='kodomo' ? '🎮 こども向け' : '👩‍💻 大人向け';

  if(!c){
    s.innerHTML=`<div class="guide">このライン（${lineName}）は<br>まだキャラが保存されていません。<br><br>先に「① キャラ」でキャラを作って<br><b>💾 保存</b>してね。</div>`;
    return;
  }
  if(!serifu.length){
    s.innerHTML=`<div class="guide">このライン（${lineName}）は<br>まだセリフが選ばれていません。<br><br>先に「② セリフ」で言葉を選んで<br><b>💾 保存</b>してね。</div>`;
    return;
  }

  const prompts = serifu.map(w=>buildPrompt(c, w, promptLang));
  let html = `
    <div class="charbar">${lineName}／キャラ：<b>${c.name||'未設定'}</b>（${c.motif}）／セリフ ${serifu.length}個</div>
    <div class="langtoggle">
      <button data-lang="ja" class="${promptLang==='ja'?'on':''}">日本語</button>
      <button data-lang="en" class="${promptLang==='en'?'on':''}">English</button>
    </div>
    ${prompts.map((p,i)=>`
      <div class="pcard">
        <div class="pnum">スタンプ ${i+1}（「${serifu[i]}」）</div>
        <div class="ptxt">${p.replace(/</g,'&lt;')}</div>
        <button class="pcopy" data-i="${i}">📋 これをコピー</button>
      </div>`).join('')}
    <div class="tools">
      <button class="b-copy" id="copyAll">📋 全部まとめてコピー</button>
    </div>
    <p class="note">コツ：①で決めた見た目の画像を“参考画像”として一緒に渡すと、同じキャラで揃います。文字は後から入れてもOK。</p>
  `;
  s.innerHTML=html;

  s.querySelectorAll('.langtoggle button').forEach(b=>{
    b.onclick=()=>{ promptLang=b.dataset.lang; renderPrompt(); };
  });
  s.querySelectorAll('.pcopy').forEach(b=>{
    b.onclick=()=>{ navigator.clipboard.writeText(prompts[+b.dataset.i]).then(()=>toast('コピーしたよ！')); };
  });
  document.getElementById('copyAll').onclick=()=>{
    const all=prompts.map((p,i)=>`【${i+1}】${serifu[i]}\n${p}`).join('\n\n');
    navigator.clipboard.writeText(all).then(()=>toast('全部コピーしたよ！'));
  };
}

// ===================== ④ 売る（宣伝＆ストア最適化） =====================
// ラインに応じたニッチのハッシュタグ・訴求
function nicheTags(){
  return line==='kodomo'
    ? ["#ゲーム好きさんと繋がりたい","#10代","#ゲーマー"]
    : ["#リモートワーク","#社会人あるある","#お仕事スタンプ"];
}
function nicheAudience(){
  return line==='kodomo' ? "ゲーム好きの10代" : "在宅ワークや社会人";
}

// 本音・共感セリフを1つ選ぶ（宣伝で刺さる用）
function pickHonne(serifu){
  const keys=["めんど","疲れ","無理","それな","眠","帰りたい","おなか","現実逃避"];
  return serifu.find(w=>keys.some(k=>w.includes(k))) || serifu[0] || "";
}

// SNS宣伝文を3種つくる
function buildSNS(c, serifu){
  const name=c.name||"新キャラ";
  const motif=c.motif||"キャラ";
  const s1=serifu[0]||"", s2=serifu[1]||"", honne=pickHonne(serifu);
  const tags=`#LINEスタンプ #新作スタンプ #${motif}スタンプ ${nicheTags().join(' ')}`;
  return [
    {label:"① 発売のお知らせ", text:
`【新作LINEスタンプ】
${name}、できました🎉

${motif}の${c.taste||"ゆるい"}キャラが、「${s1}」「${s2}」など毎日使える言葉でおしゃべり！

ダウンロードはこちら👇
（ここに販売ページのURL）

${tags} #${name}`},
    {label:"② 共感で引きこむ", text:
`「${honne}」って日、ありますよね…😂

そんな気持ち、${name}が代わりに言ってくれます。
${nicheAudience()}の毎日にどうぞ🍵
（販売ページURL）

${tags}`},
    {label:"③ キャラ紹介", text:
`はじめまして、${name}です🐾
${motif}／${c.taste||"ゆるふわ"}／${(c.traits||[]).join('・')||"マイペース"}な性格。
これから毎日をちょっと楽しくするスタンプを作っていきます！
フォロー＆応援うれしいです😊

${tags} #${name}`},
  ];
}

// ストア最適化（タイトル・説明・検索ワード）
function buildStore(c, serifu){
  const name=c.name||"キャラ";
  const motif=c.motif||"キャラ";
  const taste=c.taste||"ゆるかわ";
  const tone=c.tone||"";
  const s1=serifu[0]||"", s2=serifu[1]||"";
  // タイトル（40文字以内めやす）
  let title=`${name}｜${tone?tone+"の":""}${taste}${motif}スタンプ`;
  if(title.length>40) title=`${name}｜${taste}${motif}スタンプ`;
  // 説明文
  const desc=`${motif}の${name}が、毎日使える言葉でおしゃべり。${tone?tone+"の":""}${taste}なタッチで、${nicheAudience()}にぴったり。「${s1}」「${s2}」など${serifu.length}種類。日常・あいさつ・返事にどうぞ！`;
  // 検索ワード
  const words=[name, motif, `${motif}スタンプ`, taste, tone, "日常", "実用", "かわいい", "毎日使える"]
    .concat(line==='kodomo'?["ゲーム","10代","JK"]:["在宅ワーク","社会人","仕事"])
    .filter(Boolean);
  return {title, desc, words:[...new Set(words)]};
}

function renderSell(){
  const s=document.getElementById('sell');
  const chars=lsGet(charsKey(), []);
  const c=chars[chars.length-1];
  const serifu=lsGet(serifuKey(), []);
  const lineName = line==='kodomo' ? '🎮 こども向け' : '👩‍💻 大人向け';

  if(!c || !serifu.length){
    s.innerHTML=`<div class="guide">このライン（${lineName}）は、まだ準備が足りません。<br><br>先に「① キャラ」と「② セリフ」を作って<br><b>💾 保存</b>してね。<br>そのあと、ここで宣伝文が作れます。</div>`;
    return;
  }

  const sns=buildSNS(c, serifu);
  const store=buildStore(c, serifu);

  let html = `
    <div class="charbar">${lineName}／キャラ：<b>${c.name||'未設定'}</b>／セリフ ${serifu.length}個</div>

    <p class="q" style="font-size:16px;margin-bottom:2px">🚀 SNSで宣伝しよう</p>
    <p class="hint">売れる人＝宣伝する人。X（Twitter）やInstagramにコピペで投稿しよう。URLの部分だけ後で差し替えてね。</p>
    ${sns.map((p,i)=>`
      <div class="pcard">
        <div class="pnum">${p.label}</div>
        <div class="ptxt">${p.text.replace(/</g,'&lt;')}</div>
        <button class="pcopy" data-sns="${i}">📋 これをコピー</button>
      </div>`).join('')}

    <p class="q" style="font-size:16px;margin:22px 0 2px">🔍 ストア最適化</p>
    <p class="hint">LINEの店内検索は弱め。見つけてもらう言葉を用意しました。申請フォームに貼ってね。</p>
    <div class="pcard">
      <div class="pnum">タイトル案（${store.title.length}文字）</div>
      <div class="ptxt">${store.title.replace(/</g,'&lt;')}</div>
      <button class="pcopy" data-store="title">📋 タイトルをコピー</button>
    </div>
    <div class="pcard">
      <div class="pnum">説明文案</div>
      <div class="ptxt">${store.desc.replace(/</g,'&lt;')}</div>
      <button class="pcopy" data-store="desc">📋 説明文をコピー</button>
    </div>
    <div class="pcard">
      <div class="pnum">検索ワード（タグ）</div>
      <div class="ptxt">${store.words.join('　/　')}</div>
      <button class="pcopy" data-store="words">📋 検索ワードをコピー</button>
    </div>

    <p class="note">宣伝は1回で終わらせず、使用例つきで何度も投稿するのが上位10%のコツ。</p>
  `;
  s.innerHTML=html;

  s.querySelectorAll('.pcopy[data-sns]').forEach(b=>{
    b.onclick=()=>{ navigator.clipboard.writeText(sns[+b.dataset.sns].text).then(()=>toast('コピーしたよ！')); };
  });
  s.querySelectorAll('.pcopy[data-store]').forEach(b=>{
    b.onclick=()=>{
      const k=b.dataset.store;
      const v = k==='title'?store.title : k==='desc'?store.desc : store.words.join(' ');
      navigator.clipboard.writeText(v).then(()=>toast('コピーしたよ！'));
    };
  });
}

render();
</script>
</body>
</html>
